version: '3.8'

# ═══════════════════════════════════════════════════════════════
#  dataPlane Docker Compose
#
#  Option A (recommended): ALL-IN-ONE single image
#    docker-compose up dataplane-aio -d --build
#
#  Option B: Multi-service (for development)
#    docker-compose up -d --build
# ═══════════════════════════════════════════════════════════════

services:

  # ── ALL-IN-ONE: Single shippable image ─────────────────────
  dataplane-aio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataplane
    ports:
      - "3000:3000"    # Frontend UI
      - "8000:8000"    # Backend API
      - "5432:5432"    # PostgreSQL
    volumes:
      - aio_pgdata:/var/lib/postgresql
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    profiles:
      - aio
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── MULTI-SERVICE: Development mode ────────────────────────
  db:
    image: postgres:15
    container_name: dataplane-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataplane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/seeds/postgres_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev

  mysql:
    image: mysql:8.0
    container_name: dataplane-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: dataplane
      MYSQL_PASSWORD: dataplane123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/seeds/mysql_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev

  ollama:
    image: ollama/ollama:latest
    container_name: dataplane-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - dev
      - aio

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataplane-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dataplane
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dataplane-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - dev

volumes:
  aio_pgdata:
  postgres_data:
  mysql_data:
  ollama_data:
